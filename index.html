<html lang="es">
<head>

    <meta name="theme-color" content="#1a0f0a">
    <meta property="og:title" content="Para ti 💗">
    <meta property="og:description" content="Una carta de amor. Toca el sello para abrirla.">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg-start:#f5ebe0;--bg-end:#fce4ec;
            --paper:#fffcf5;--paper-shadow:rgba(139,90,43,.08);
            --text:#3d2c2e;--text-light:#6b5456;
            --accent:#c48b9f;--gold:#c9a96e;
            --intro-bg:#1a0f0a;--seal:#b33a3a;
        }
        html{scroll-behavior:smooth}
        body{font-family:'Crimson Pro',Georgia,serif;background:linear-gradient(160deg,var(--bg-start) 0%,#f0ddd4 40%,var(--bg-end) 100%);background-attachment:fixed;color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

        /* ===== INTRO / WAX SEAL ===== */
        #intro{position:fixed;inset:0;z-index:1000;background:var(--intro-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity 1.4s cubic-bezier(.4,0,.2,1),transform 1.4s cubic-bezier(.4,0,.2,1);-webkit-tap-highlight-color:transparent}
        #intro.hidden{opacity:0;transform:scale(1.08);pointer-events:none}
        .seal-wrap{position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center}
        .seal-wrap::before{content:'';position:absolute;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(196,139,159,.12) 0%,transparent 70%);animation:sealGlow 2.5s ease-in-out infinite}
        .seal{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#e07070,#b33a3a 45%,#7a1a1a 100%);box-shadow:0 4px 15px rgba(0,0,0,.4),0 0 40px rgba(179,58,58,.25),inset 0 -3px 6px rgba(0,0,0,.3),inset 0 3px 6px rgba(255,255,255,.1);position:relative;z-index:1;transition:transform .3s ease,box-shadow .3s ease;animation:sealFloat 4s ease-in-out infinite}
        .seal:hover{transform:scale(1.06);box-shadow:0 4px 15px rgba(0,0,0,.4),0 0 60px rgba(179,58,58,.35),inset 0 -3px 6px rgba(0,0,0,.3),inset 0 3px 6px rgba(255,255,255,.1)}
        .seal svg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;color:rgba(255,220,220,.7)}
        .seal.cracking{animation:sealCrack .6s ease forwards}
        .intro-title{font-family:'Playfair Display',serif;font-size:1.8rem;font-style:italic;color:#faf3e8;margin-top:2rem;letter-spacing:.06em;opacity:0;animation:fadeUp 1s ease .3s forwards}
        .intro-hint{font-family:'Crimson Pro',serif;font-size:.85rem;color:rgba(250,243,232,.3);margin-top:1rem;letter-spacing:.2em;text-transform:lowercase;opacity:0;animation:fadeUp 1s ease .8s forwards,breathe 3s ease-in-out 2s infinite}
        @keyframes sealFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
        @keyframes sealGlow{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.4);opacity:.8}}
        @keyframes sealCrack{0%{transform:scale(1);opacity:1}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1.4);opacity:0}}
        @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        @keyframes breathe{0%,100%{opacity:.3}50%{opacity:.55}}

        /* ===== CANVASES ===== */
        #particles,#hearts{position:fixed;inset:0;z-index:0;pointer-events:none}
        #hearts{z-index:100;pointer-events:none}

        /* ===== LETTER ===== */
        .letter-container{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:2rem 1rem 5rem;min-height:100vh;display:flex;flex-direction:column;justify-content:center}

        /* ===== PAPER ===== */
        .paper{background:var(--paper);border-radius:3px;padding:3rem 2.8rem 2.5rem;box-shadow:0 1px 2px var(--paper-shadow),0 4px 8px rgba(139,90,43,.05),0 12px 32px rgba(139,90,43,.06),0 24px 60px rgba(139,90,43,.04);position:relative;overflow:visible}
        .paper::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 15% 20%,rgba(196,139,159,.03) 0%,transparent 50%),radial-gradient(ellipse at 85% 80%,rgba(201,169,110,.04) 0%,transparent 50%),radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.6) 0%,transparent 40%);pointer-events:none;border-radius:3px}
        .paper::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 31px,rgba(200,180,160,.03) 31px,rgba(200,180,160,.03) 32px);pointer-events:none;opacity:.5;border-radius:3px}

        /* ===== PAPER HEADER ===== */
        .paper-header{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid rgba(196,139,159,.15)}
        .paper-date{font-family:'Playfair Display',serif;font-size:.85rem;color:var(--text-light);font-style:italic}
        .paper-counter{font-size:.8rem;color:var(--accent);text-align:right;line-height:1.5;margin-top:.2rem;font-variant-numeric:tabular-nums}
        .paper-counter .num{font-weight:600;color:var(--text)}
        .lang-switch{position:fixed;top:12px;right:12px;z-index:500;display:flex;gap:2px;background:rgba(255,252,245,.85);backdrop-filter:blur(8px);padding:4px 8px;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.08);opacity:0;transition:opacity .6s ease}
        .lang-switch.show{opacity:1}
        .lang-switch button{border:none;background:transparent;font-family:'Crimson Pro',serif;font-size:.78rem;color:var(--text-light);padding:2px 6px;border-radius:12px;cursor:pointer;transition:all .2s ease;letter-spacing:.03em}
        .lang-switch button:hover{color:var(--text);background:rgba(196,139,159,.1)}
        .lang-switch button.active{color:var(--accent);background:rgba(196,139,159,.12);font-weight:600}

        /* ===== LETTER CONTENT ===== */
        .letter-content{position:relative;z-index:1}
        .letter-content p{font-size:1.12rem;line-height:1.9;margin-bottom:1.5rem;color:var(--text);text-align:justify;hyphens:auto;font-weight:400;transition:opacity .3s ease}
        .letter-content p:last-of-type{margin-bottom:0}
        .letter-content p.drop::first-letter{font-family:'Playfair Display',Georgia,serif;font-size:3.4rem;float:left;line-height:.85;margin-right:.08em;margin-top:.08em;color:var(--accent);font-weight:700}

        /* ===== SONG LINKS ===== */
        .letter-content a.song{color:inherit;text-decoration:none;background:transparent;transition:background .5s ease;border-radius:3px;padding:1px 2px;margin:-1px -2px;cursor:text;text-decoration:none!important}
        .letter-content a.song:hover{background:linear-gradient(120deg,rgba(196,139,159,.13) 0%,rgba(201,169,110,.06) 100%);cursor:pointer}
        .letter-content a.song:active{background:linear-gradient(120deg,rgba(196,139,159,.22) 0%,rgba(201,169,110,.1) 100%)}

        /* ===== PLAYLIST ===== */
        .playlist-section{text-align:center;margin-top:2rem;padding-top:1.5rem;position:relative}
        .playlist-section::before{content:'♡ ♡ ♡';display:block;color:var(--gold);font-size:.7rem;letter-spacing:.8em;margin-bottom:1.5rem;opacity:.5}
        .playlist-section p{text-align:center!important;font-style:italic;font-size:1.05rem!important;color:var(--text-light);margin-bottom:.6rem!important}
        a.playlist{color:var(--accent)!important;font-family:'Playfair Display',serif;font-size:1.15rem;font-style:italic;text-decoration:none;position:relative;display:inline-block;padding:.3em 0;cursor:pointer!important;background:none!important;transition:color .3s ease,transform .3s ease}
        a.playlist::after{content:'';position:absolute;bottom:0;left:50%;width:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);transition:width .8s cubic-bezier(.4,0,.2,1),left .8s cubic-bezier(.4,0,.2,1)}
        a.playlist:hover::after{width:100%;left:0}
        a.playlist:hover{color:#a76e85!important;transform:scale(1.02)}

        /* ===== SIGNATURE ===== */
        .signature{font-family:'Dancing Script',cursive;font-size:2.2rem;color:var(--accent);text-align:center;margin-top:2rem;font-weight:700;line-height:1.3;cursor:pointer;user-select:none;transition:transform .2s ease}
        .signature:hover{transform:scale(1.03)}

        /* ===== SONG LIST ===== */
        .songlist-toggle{text-align:center;margin-top:1.8rem}
        .songlist-toggle button{border:none;background:transparent;color:var(--gold);font-family:'Crimson Pro',serif;font-size:.85rem;cursor:pointer;padding:4px 12px;border-radius:12px;transition:all .3s ease;opacity:.6;letter-spacing:.05em}
        .songlist-toggle button:hover{opacity:1;background:rgba(201,169,110,.1)}
        .songlist{max-height:0;overflow:hidden;transition:max-height .6s cubic-bezier(.4,0,.2,1),opacity .4s ease,margin .4s ease;opacity:0;margin-top:0}
        .songlist.open{max-height:600px;opacity:1;margin-top:1.5rem}
        .songlist-inner{border-top:1px solid rgba(201,169,110,.2);padding-top:1rem}
        .songlist h4{font-family:'Playfair Display',serif;font-size:1rem;color:var(--accent);text-align:center;margin-bottom:1rem;font-style:italic;font-weight:400}
        .songlist ol{text-align:left;list-style:none;padding:0;counter-reset:song}
        .songlist ol li{counter-increment:song;padding:.35rem 0 .35rem 2rem;position:relative;font-size:.92rem;color:var(--text-light);line-height:1.5}
        .songlist ol li::before{content:counter(song) '.';position:absolute;left:0;color:var(--gold);font-style:italic;font-size:.85rem}
        .songlist ol li a{color:var(--text-light);text-decoration:none;transition:color .2s}
        .songlist ol li a:hover{color:var(--accent)}

        /* ===== MUSIC TOGGLE ===== */
        .music-btn{position:fixed;bottom:16px;right:16px;z-index:500;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,252,245,.85);backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(0,0,0,.08);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .6s ease,transform .2s ease}
        .music-btn.show{opacity:1}
        .music-btn:hover{transform:scale(1.1)}
        .music-btn svg{width:18px;height:18px;color:var(--accent);transition:color .2s}
        .music-btn.playing svg{animation:musicPulse 1.5s ease-in-out infinite}
        @keyframes musicPulse{0%,100%{opacity:.7}50%{opacity:1;transform:scale(1.1)}}

        /* ===== SCROLL REVEAL ===== */
        .reveal{opacity:0;transform:translateY(20px);transition:opacity .8s cubic-bezier(.4,0,.2,1),transform .8s cubic-bezier(.4,0,.2,1)}
        .reveal.visible{opacity:1;transform:translateY(0)}

        /* ===== HEART RAIN ===== */
        .heart-particle{position:fixed;z-index:99;pointer-events:none;animation:heartFall linear forwards}
        @keyframes heartFall{0%{opacity:1;transform:translateY(0) rotate(0deg)}100%{opacity:0;transform:translateY(100vh) rotate(360deg)}}

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar{width:5px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:rgba(196,139,159,.25);border-radius:3px}
        ::-webkit-scrollbar-thumb:hover{background:rgba(196,139,159,.4)}
        ::selection{background:rgba(196,139,159,.25);color:var(--text)}

        /* ===== RESPONSIVE ===== */
        @media(max-width:640px){
            .paper{padding:2.2rem 1.6rem 2rem}
            .letter-content p{font-size:1.02rem;line-height:1.85;text-align:left;hyphens:none}
            .letter-content p.drop::first-letter{font-size:2.8rem}
            .seal{width:74px;height:74px}
            .seal svg{width:30px;height:30px}
            .intro-title{font-size:1.5rem}
            .signature{font-size:1.8rem}
            .letter-container{padding:1.2rem .6rem 3rem}
            .lang-switch{top:8px;right:8px;padding:3px 6px}
            .lang-switch button{font-size:.72rem;padding:2px 4px}
            .paper-header{flex-direction:column;gap:.3rem}
            .paper-counter{text-align:left}
        }
        @media(max-width:380px){
            .paper{padding:1.8rem 1.2rem 1.5rem}
            .letter-content p{font-size:.97rem}
        }
    </style>
</head>
<body>

<!-- INTRO -->

    </div>
</main>

      "{1} It's something silly, but I love it when you laugh, when one of my weird jokes makes you smile. You have no idea how happy that makes me. {2} You have the most precious eyes I've ever seen in my life, they're magical. As if, if I looked into them too long, they'd take me to another dimension. And I wouldn't really mind... getting lost in your gaze to get there.",

      "{10} È sul serio, continuo a cercare i difetti di cui parli ma non li trovo da nessuna parte. Mi piace ogni parte di te: il modo in cui sei, il modo in cui ti esprimi, il modo in cui mi fai sentire. Mi piaci tu. {11} Sono capace di fare qualsiasi cosa solo per dimostrarti quanto, quanto, moooolto, ma tanto ti amo. Credo di averlo chiarito: per me, una parola può facilmente essere vuota, per questo preferisco dimostrare i miei sentimenti invece di dirli. {12} E lo capisco, anche io non sono la migliore a esprimermi, ma è che non esistono parole per esprimertelo.",

      "{18} Ricordo che non mi serve niente di ufficiale per sapere che sei l'amore della mia vita. {19} Nessuno sarà mai migliore di te in nessun senso. Ai miei occhi è così: sei la definizione della perfezione in persona. {20} Odio quando ti senti triste, quando il tuo bel sorriso scompare dal tuo viso, e odio questo. Vederti felice mi rende felice. Ma la cosa più magica di tutto questo è che anche stando triste non se ne va quel brillio così caratteristico che hai. Sei più brillante di un diamante, e più preziosa anche, ovviamente.",

      "{29} Tua, solo tua. E anche se ci separassimo, lo continuerebbe a essere. Per sempre il mio cuore continuerà a battere per te. Avevo paura di amare di nuovo, tanta paura, più di quanto possa descrivere. Ricordavo che l'amore faceva male, e molto, ma l'amore fa di tutto tranne che fare male. Trovandoti ho deciso di rischiare e prendere il rischio di soffrire di nuovo. È la migliore decisione che potessi prendere. Ne sono molto sicura. Mi sento bene con te, sento che ce la posso fare con tutto quello che verrà, perché ti ho te. Mi fai bene.",
      "{30} Non sai l'orgoglio che provo nel sapere che sei la mia ragazza. Non potrei mai vergognarmi di esserlo. È il più grande orgoglio averti come ragazza. Sai? Tipo: bro, guarda la mia donna, lei ha scelto me. ME. Grazie per lasciarmi essere la tua ragazza, per avermi scelta tra tutte le altre opzioni, per avermi concesso il grande privilegio di conoscerti. {31} Ogni notte chiedo a Dio di proteggerti e darti felicità, perché te la meriti più di chiunque altro al mondo.",
      "{32} Voglio stare con te sempre, vederti trionfare, ridere, raggiungere i tuoi obiettivi, vederti felice essendo te stessa. Non tutti i giorni sono felici e lo so, per questo mi impegno a esserci sia nei momenti buoni che in quelli cattivi. Sarò lì con te per abbracciarti mentre piangi o ridi. Di questo si tratta amare: essere sempre lì, succeda quello che succede. E per questo non mi allontanerò mai dal tuo fianco, come un cagnolino di Minecraft. L'unico modo in cui smetterò di stare con te è quando tu deciderai che lo smetta.",
      "Ti ho chiesto, ti ho desiderata ogni 11:11. Mi sei mancata tutta la vita senza saperlo. Sei la cosa migliore che mi potesse capitare, e sul serio sono molto grata che mi permetti di essere parte della tua vita. So che le tue altre esperienze d'amore non sono state le migliori, per questo mi impegno ogni giorno per farti imparare cos'è l'amore, così se un giorno non ci sarò più, saprai cosa meriti e cosa no. Forse non posso darti tutto quello che meriti, ma posso darti tutto l'amore che il mio cuore ha da offrire.",
      "Potrebbe capitarmi di parlare a volte di argomenti sessuali. Voglio solo dire che tutto quello che dico è con umorismo, e in nessun momento vorrei che tu faccia qualcosa che non vuoi fare, e tantomeno mi arrabbierò perché non fai qualcosa. Ogni persona di questo mondo merita rispetto, merita che il suo corpo e le sue decisioni vengano rispettati. Mi dispiace se nessuno ti ha rispettata prima. Qui ci sono io per farlo per tutti quelli che non lo hanno fatto. E anche se in verità non so cosa hai vissuto, ti capisco e ti sostengo, e sarò sempre qui per te se hai bisogno di parlare di qualsiasi cosa. Credimi, mi importa. Ogni minima cosa che dici, mi importa. Mi importa davvero. Come se hai appena visto una formica che trasportava un pezzo di pane, o come se stai per traslocare, o come se hai bevuto acqua e sapeva di merda. Tutto questo mi importa. Non sono cose sciocche per me, ti assicuro che saranno importanti per me, e me le ricorderò, qualunque cosa sia.",
      "E anche se smettessimo di stare insieme, continuerei a essere qui per quando hai bisogno di me. Come se la tua nuova partner fa schifo con te e devo darle un paio di \"lezioni\" su come meriti di essere trattata, o come se stai per sposarti e te ne penti, io ti cerco e scappiamo insieme. Succeda quello che succeda, sarò sempre qui per te. Non importa cosa."
    ]

    "p": [
      "Köszönöm, hogy te vagy! Hogy minden nap te vagy, hogy része lehetek az életednek, hogy a barátnőd lehetek, hogy minden nap ennyi szeretetet adsz nekem... egyszerűen, köszönöm mindent. Még mindig azon gondolkozom, hogyan tudtam ilyen sokáig élni nélküled. Tökéletesen kiegészítesz. {0} Egyáltalán nem bántam meg, hogy ezt tetted.",
      "Kiviszed belőlem azt a furcsa, de egyben különleges oldalamat. És igen, tudom, hogy mindig ezt mondom, de ez az igazság. Megesküszöm, hogy soha senki nem hozta ki belőlem ezt a részt, ezt a vágyat a szeretetre, ezt az igényt, hogy megmutassam mennyire tudlak szeretni, ezt a vágyat, hogy megtanítsam neked, mi az szeretet, hogy megtanítsalak szeretni... Minden nap egyre jobban felfedezem, milyen érzés szeretni. Nem fáj, ugye? Furcsa, nem? Azt hiszem, igaz: a szeretetnek nem szabadna fájnia. Csak ezt én még nem tudtam. Lenyűgöz, ahogy egy hónap alatt —igen, pontosan, EGY HÓNAP— annyi mindent megtanítottál a szeretetről. Amit nem sikerült megtanulnom évekig tartó leszbikus és heteroszexuális éveim alatt, azt megtanultam veled egy hónap alatt: 31 nap, 44 800 perc, 2 628 002,88 másodperc. Köszönöm, hogy megtanítottál szeretni.",
      "{1} Butaság, de imádom, amikor nevetesz, amikor az egyik furcsa viccemtől elmosolyodsz. Fogalmad sincs, mennyire boldoggá tesz ez. {2} Életed legszebb szemei a tieid, varázslatosak. Olyanok, mintha, ha túl sokáig nézném őket, egy másik dimenzióba vinnének. És igazából nem is zavarna... elveszni a tekintetedben, hogy eljussak oda.",
      "{3} Régóta szükségem volt erre, és azt hiszem, végre megtaláltam. Őszintén szólva nem bánnám, ha a hátralévő életemet veled tölthetném. Nem bánnám, ha a hátralévő életemben csak a tiéd lennék. {4} És tudom, hogy egyedül is tudod vigyázni magadra, de ha nem tudsz, mindig itt leszek, hogy segítsek. Bármikor is ott tartasz, hogy épp meg akarsz bukni, megtartalak és segítek. Soha nem hagylak elbukni. Soha.",
      "{5} Igen, tudom. Tudom, hogy még egy egész élet előttünk áll, de akarok egy babát, aki olyan gyönyörű, mint az anyukája. És nem, nem azért, mert imádom a pelenkacserélés ötletét, de nem érdekel, csak legyen egy családunk melletted. {6} Semmi sem valóságosabb ennél. Nem számít, mekkora távolságra leszünk, a vörös szál mindig összeköt minket.",
      "{7} Szeretném tudni, mi az a szeretet veled, bár azt hiszem, azóta tudom, hogy megismertelek. {8} Nem hiszem, hogy az lenne, de így is... ezerszer is elkövetném azt a \u201ehib\u00e1t\u201d. {9} még mindig keresem a szavakat, hogy le tudjam írni. Azt érzem, hogy igazán szerettek, mint még soha azelőtt. A világ legszerencsésebb emberének érzem magam.",
      "{10} Komolyan, továbbra is keresem azokat a hibákat, amikről beszélsz, de sehol sem találom őket. Minden részedet szeretem: ahogy vagy, ahogy kifejezed magad, ahogy engem érzel magaddal. Téged szeretek. {11} Bármit megtennék csak azért, hogy megmutassam, mennyire, mennyire, noooormányire, de tényleg nagyon szeretlek. Azt hiszem, ez egyértelmű: számomra egy szó könnyen üres lehet, ezért inkább megmutatom az érzéseimet ahelyett, hogy kimondanám őket. {12} És megértem, én sem vagyok a legjobb a kifejezést illetően, de az az igazság, hogy nem léteznek szavak, amikkel kifejezhetném feléd.",
      "{13} Hozzászoktam ahhoz, hogy képtelen vagyok kitörölni a fejemből. Mindenhol ott vagy: az álmaimban, a gondolataimban. Gyakorlatilag mindig együtt vagyunk, még akkor is, ha nem beszélünk, hiszen a nap 24 órájában rád gondolok. {14} Ismétlem: nem tudom abbahagyni, hogy rád gondoljak. Mindegy, mit csinálok, a fejem mindig téged járt, nem tudom megállítani. Ahogy azt sem tudom megállítani, hogy az életem véletlenszerű pillanataiban eszembe jusson egy-egy beszélgetésünk, és elmosolyodjam. {15} Soha nem fogom megunni ezt mondani: te vagy a kedvenc gondolatom. Te vagy az első, amire felébredek, és az utolsó, amire elalszom. Nem tudom, hogyan csináltad, nem tudom kihajtani a fejemből, de mélyen belül ez tetszik. Határozottan te vagy a legjobb gondolat, ami valaha is átsuhant az agyamon. A legjobb, legfényesebb és legszebb gondolat.",
      "{16} Ha az életemet kell feláldoznom a tiédért, szívesen megteszem. Amikor azt mondom, hogy bármit megtennék érted, nagyon komolyan gondolom. {17} Komolyan, mintha egyenesen az álmaimból léptél volna elő. Pontosan olyan vagy, ahogy megálmodtalak, egy valóra vált álom vagy. Még mindig nehéz elhinni, hogy ez igaz. Ha ez egy álom, azt kérem az Istentől, hogy soha ne ébresszen fel.",
      "{18} Emlékszem, hogy nem kell semmi hivatalos ahhoz, hogy tudjam, te vagy az életem szerelme. {19} Senki sem lesz soha jobb nálad semmilyen értelemben. A szememben ez így van: te vagy a tökéletesség megtestesülése. {20} Utálom, amikor szomorú vagy, amikor eltűnik a szép mosolyod az arcodról, és utálom ezt. Látni, ahogy boldog vagy, engem is boldoggá tesz. De a legvarázslatosabb az egészben az, hogy még akkor sem tűnik el az a jellegzetes ragyogásod, ha szomorú vagy. Fényesebb vagy egy gyémántnál, és értékesebb is, persze.",
      "{21} Minden másodperc, amit veled töltök, különlegesnek érződik, igazán varázslatosnak. Bármit is csinálunk, veled mindig különleges. És eléggé biztos vagyok benne, hogy azért érződik különlegesnek, mert veled van. Lehetetlennek tartom, hogy bárki mással így éreznék. {22} Valami, ami jól esik, valami, ami élettel tölteni engem. Tudom, hogy sosem voltam halott, de visszahoztál az életbe, visszadtad azt a ragyogást, amit elvettek tőlem. Bármelyik rossz napból lehet jó nap pusztán azzal, hogy meghallom a hangodat.",
      "{23} Nem akarom, hogy valaha is elengedj, soha, soha, soha, soha. Tudom, néha hibázok, vagy őszintén szólva, elég gyakran. Nem szándékosan csinálom, az utolsó dolog, amit akarok, hogy egy butaság miatt eltávolodj tőlem. Ez a legrosszabb rémálmom. Garantálom, hogy bármi is történik, bármit is mondok, továbbra is szeretni foglak. Bár néha butaságok miatt mérges leszek, soha nem lesz igazán a te hibád. Megígérem. {24} A felhőkön lebegve élem az életemet, egy álmot. Nem akarok leszállni soha. Hagyj itt repülni, élni a legnagyobb álmomat és vágyamat: boldognak lenni.",
      "{25} Bízom benned. A kezedben van a szívem, és tudom, hogy nagyon biztonságban van ott. Neked adom a szívem. Nem hiszem, hogy lenne nálad jobb ember, akinek odaadhatnám. Hiszen megérdemled: te gyógyítottad meg, szeretettel begyógyítottad minden egyes sebét. És bár még nagyon sok mindent meg kell gyógyulnia, biztos vagyok benne, hogy szeretettel meggyógyítod azt, amit mások szavakkal törték szét. {26} Nagyon biztos vagyok benne, hogy ha minden elfelejtenék, visszatérnék hozzád. Tudod, miért? Mert érezném, hogy hiányzik valami. Biztosan megpróbálnám kitölteni, ami hiányzik, ahogy már tettem, de semmi sem változna. Senki sem tudna úgy teljessé tenni, mert egyikük sem lennél te. A lelkem akkor is téged keresne, ha nem is emlékezném rád. Ha az életem egy kirakós lenne, te mindig is a hiányzó darab voltál.",
      "{27} Gyógyíts meg, szerelmem, kérlek. Szomorú, hogy valamit meggyógyítasz, amit te magad nem is törtél szét, de úgy teszed, hogy még csak nem is erőlködsz. Élve érzem magam veled, önmagamnak érzem magam, úgy érzem, hogy lehetek én magam, anélkül, hogy valaki más lennék. Veled tudok önmagam lenni. Biztonságban érzem magam melletted. Tudom, hogy semmi rossz nem történhet, amíg veled vagyok.",
      "{28} Kiviszed belőlem a gyerekes oldalamat, úgy érzem magam melletted, mint egy kislány, és imádom ezt az érzést. És tényleg furcsa, mert ez az egyik dolog, amit utáltam a korábbi kapcsolataimban: a gyerekes embereket. Spoiler: a probléma mindig az volt, hogy férfi volt. A férfiak amúgy is undorítanak, és nem voltam hajlandó elviselni a gyerekes viselkedésüket, még akkor sem, amikor \u201eheter\u00f3\u201d voltam. Most már rájöttem, hogy a gyerekesség nem rossz dolog — sőt, jó dolog, azt jelenti, hogy kihozod belőlem a belső gyermeket. Ha most itt lenne a kis én, és mondhatna véleményt, biztos vagyok benne, hogy nem értené, miért vagyok egy nővel és nem egy kék szemű szőke férfival, de miután megértené, milyen jól érzem magam veled, mindent megértene, és a lehető leghamarabb meg akarna ismerni. Ha \u201efi\u00faim\u00e1d\u00f3 4life\u201d voltam, az csak azért volt, hogy beilleszkedjek és olyan legyek, mint a többiek, sajnos. Bár megismerhettelek volna hamarabb. Nem tudom, őszintén, hogy akkoriban úgy tudtalak volna értékelni, ahogy most, de azt kívánom, bárcsak a lelkem sokkal hamarabb megtalált volna téged.",
      "{29} Tiéred, csak a tiéged. És ha még külön is válnánk útjaink, az is az maradna. Örökké a szívem érted fog dobogni. Féltem újra szeretni, nagyon féltem, jobban, mint el tudom mondani. Emlékeztem, hogy a szeretet fáj, és nagyon, de a szeretet mindent megtesz, csak épp nem fáj. Amikor megtaláltalak, úgy döntöttem, hogy kockáztatok, és vállalom, hogy újra szenvedjek. Ez a legjobb döntés, amit hozhattam. Nagyon biztos vagyok ebben. Jól érzem magam veled, úgy érzem, mindennel meg tudok bánni, ami jön, mert veled vagyok. Jót teszel nekem.",
      "{30} Fogalmad sincs, milyen büszke vagyok rá, hogy a barátnőm vagy. Soha nem tudnék szégyenkezni amiatt. A legnagyobb büszkeség, hogy a barátnőm vagy. Tudod? Olyasmi: tesó, nézd az én nőm, ő engem választott. ENGEM. Köszönöm, hogy a barátnőd lehetek, hogy engem választottál a többi lehetőség közül, hogy megadod nekem azt a nagy kiváltságot, hogy megismerjelek. {31} Minden éjszaka azt kérem az Istentől, hogy vigyázzon rád és boldogságot adjon neked, mert senki más nem érdemli meg annyira a világon.",
      "{32} Veled akarok lenni mindig, látni, ahogy boldogulsz, nevetesz, eléred a céljaidat, látni, ahogy boldog vagy önmagadként. Nem minden nap boldog, és ezt tudom, ezért elkötelezem magamat amellett, hogy ott vagyok mind a jó, mind a rossz pillanatokban. Ott leszek veled, hogy megöleljelek, miközben sírsz vagy nevetzel. Ez az, ami a szeretetről szól: mindig ott lenni, bármi is történjen. És ezért soha nem hagyom el az oldaladat, mint egy Minecraft kutyus. Az egyetlen módja annak, hogy abbahagyjam, hogy veled legyek, az, ha te úgy döntesz, hogy hagyjam.",
      "Téged kértem, téged kívántam minden 11:11-kor. Az egész életemben vágytam rád anélkül, hogy tudtam volna. Te vagy a legjobb dolog, ami történhetett velem, és tényleg nagyon hálás vagyok, hogy részese lehetek az életednek. Tudom, hogy a korábbi szerelmi tapasztalataid nem voltak a legjobbak, ezért minden nap erőfeszítéseket teszek azért, hogy megtanuld, mi az a szeretet, hogy ha egy nap már nem leszek én, tudd, mi az, amit megérdemelsz, és mi nem. Lehet, hogy nem tudok megadni neked mindent, amit megérdemelsz, de meg tudom adni neked az összes szeretetet, amit a szívem fel tud kínálni.",
      "Lehet, hogy néha szexuális témákról beszélek. Csak azt akarom mondani, hogy mindent, amit mondok, humorral teszek, és egyetlen pillanatban sem akarom, hogy olyat csinálj, amit nem akarsz, és főleg nem fogok mérges lenni, mert nem csinálsz valamit. Minden ember ezen a világon megérdemli a tiszteletet, megérdemli, hogy a testét és döntéseit tiszteletben tartsák. Sajnálom, ha korábban senki nem tisztelt téged. Itt vagyok én, hogy megtegyem helyettük mindazok helyett, akik nem tették. És bár tényleg nem tudom, min mentél keresztül, megértelek és melletted állok, és mindig itt leszek neked, ha beszélned kell bármiről. Hidd el, fontos nekem. Minden apróság, amit mondasz, fontos nekem. Tényleg fontos. Akár úgy, hogy épp láttál egy hangyát, ami egy darab kenyeret cipel, vagy úgy, hogy épp költöznél, vagy úgy, hogy itál vizet, és az ízlett igazi szarnak. Mindez fontos nekem. Nem butaságok ezek számomra, garantálom, hogy fontosak lesznek, és emlékezni fogok rájuk, bármiről is legyen szó.",
      "És ha már nem lennénk együtt, továbbra is itt leszek, amikor szükséged van rám. Mint például, ha az új párod egy igazi seggfej veled, és adnom kell neki pár \u201eleck\u00e9t\u201d arról, hogyan érdemled meg, hogy bántsanak, vagy mint amikor épp össze akarsz házasodni, de meggondolod magad, akkor megtalállak, és együtt elszökünk. Bármi is történjen, mindig itt leszek neked. Nem számít, mi."
    ]

    "p": [
      "¡Gracias por ser tú! Por ser tú cada día, por permitirme ser parte de tu vida, por dejarme ser tu novia, por todo el amor que me das cada día... simplemente, gracias por todo. Aún me pregunto cómo pude vivir tanto tiempo sin ti. Me complementas perfectamente. {0} no me arrepiento en nada de que lo hayas hecho.",
      "Me sacas ese lado tan raro y a la vez especial. Y sí, ya sé que lo digo siempre, pero es la verdad. Te puedo jurar que nunca nadie me había sacado esta parte de mí, estas ganas de amar, estas ganas de demostrarte lo mucho que te puedo amar, estas ganas de enseñarte lo que es el amor, estas ganas de enseñarte a amar... Cada día descubro aún más cómo se siente amar. ¿No duele? ¿Raro, no? Supongo que es cierto: el amor no debe doler. Solo que eso yo aún no lo sabía. Me fascina cómo en un mes —sí, exacto, UN MES— me enseñaste tantas cosas de amar. Lo que no logré aprender en años lesbianos y años heterosexuales lo aprendí contigo en un mes: 31 días, 44.800 minutos, 2.628.002,88 segundos. Gracias por enseñarme a amar.",
      "{1} Es algo tonto, pero me encanta cuando ríes, cuando una de mis extrañas bromas te hacen sonreír. No sabes lo feliz que me hace eso. {2} Tienes los ojos más preciosos que he visto en mi vida, son mágicos. Como si, si los mirara demasiado, me fueran a llevar a otra dimensión. Y no me importaría mucho, en verdad... perderme en tu mirada para llegar ahí.",
      "{3} Lo llevo necesitando hace mucho, y creo que por fin lo encontré. No me molestaría pasar el resto de mi vida contigo, siendo sincera. No me molestaría reservarte para mí por el resto de mi vida. {4} Y sé que sabes cuidarte sola, pero cuando no puedas, siempre estaré para ayudarte. Siempre que estés a punto de caer, te atraparé y ayudaré. No te voy a dejar caer nunca. Nunca.",

/* ===== STATE ===== */
var lang='es';
var START=new Date('2026-06-12T12:13:00+02:00');

/* ===== RENDER ===== */
function render(){
    var t=L[lang]; if(!t) return;
    // Intro
    var it=document.getElementById('introTitle');if(it)it.textContent=t.intro;
    var ih=document.getElementById('introHint');if(ih)ih.textContent=t.hint;
    // Date & Counter
    document.getElementById('paperDate').textContent=t.date;
    updateCounter(t);
    // Paragraphs
    var c=document.getElementById('content'); c.innerHTML='';
    t.p.forEach(function(text,i){
        var p=document.createElement('p');
        if(i===0) p.className='drop reveal';
        else p.className='reveal';
        var html=text.replace(/\{(\d+)\}/g,function(m,n){return S[parseInt(n)]||m;});
        p.innerHTML=html;
        c.appendChild(p);
    });
    // Playlist
    document.getElementById('playlistPre').textContent=t.playlist_pre;
    document.getElementById('playlistLink').textContent=t.playlist_link;
    // Closing
    document.getElementById('closing').textContent=t.close;
    // Signature
    document.getElementById('signature').textContent=t.sig;
    // Song list
    document.getElementById('slTitle').textContent=t.sl_title;
    var sl=document.getElementById('songlist');
    document.getElementById('songlistBtn').textContent=sl.classList.contains('open')?t.sl_close:'♪';
    // Re-observe
    observeReveals();
    // Music btn
    updateMusicBtn(t);
}

function updateCounter(t){
    var now=new Date();
    var diff=now-START;
    var d=Math.floor(diff/864e5);
    var h=Math.floor((diff%864e5)/36e5);
    var m=Math.floor((diff%36e5)/6e4);
    var s=Math.floor((diff%6e4)/1e3);
    var el=document.getElementById('counter');
    el.innerHTML=t.counter_pre+' <span class="num">'+d+'</span> '+t.days+', <span class="num">'+h+'</span> '+t.hours+', <span class="num">'+m+'</span> '+t.minutes+' '+t.and+' <span class="num">'+s+'</span> '+t.seconds+' '+t.counter_suf;
}

function updateMusicBtn(t){
    var btn=document.getElementById('musicBtn');
    btn.title=musicPlaying?t.music_on:t.music_off;
    btn.setAttribute('aria-label',musicPlaying?t.music_on:t.music_off);
}

/* ===== LANGUAGE SWITCHER ===== */
document.getElementById('langSwitch').addEventListener('click',function(e){
    var b=e.target.closest('button[data-lang]');
    if(!b) return;
    lang=b.dataset.lang;
    this.querySelectorAll('button').forEach(function(x){x.classList.remove('active')});
    b.classList.add('active');
    render();
});

/* ===== INTRO ===== */
(function(){
    var intro=document.getElementById('intro');
    var seal=document.getElementById('seal');
    document.body.style.overflow='hidden';
    function open(){
        seal.classList.add('cracking');
        setTimeout(function(){
            intro.classList.add('hidden');
            document.body.style.overflow='';
            document.getElementById('langSwitch').classList.add('show');
            document.getElementById('musicBtn').classList.add('show');
            setTimeout(function(){
                var r=document.querySelectorAll('.reveal');
                for(var i=0;i<Math.min(3,r.length);i++) r[i].classList.add('visible');
            },500);
            setTimeout(function(){intro.remove()},1500);
        },600);
    }
    intro.addEventListener('click',open);
    intro.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
})();

/* ===== COUNTER TICK ===== */
setInterval(function(){var t=L[lang];if(t)updateCounter(t)},1000);

/* ===== MUSIC ===== */
var musicPlaying=false;
var audio=document.getElementById('bgMusic');
audio.volume=0.15;
document.getElementById('musicBtn').addEventListener('click',function(){
    if(musicPlaying){audio.pause();musicPlaying=false;this.classList.remove('playing')}
    else{audio.play().catch(function(){});musicPlaying=true;this.classList.add('playing')}
    var t=L[lang];if(t)updateMusicBtn(t);
});

/* ===== HEART RAIN ===== */
document.getElementById('signature').addEventListener('click',function(){

/* ===== SONG LIST ===== */
document.getElementById('songlistBtn').addEventListener('click',function(){
    var sl=document.getElementById('songlist');
    var isOpen=sl.classList.contains('open');
    if(isOpen){sl.classList.remove('open');this.textContent='♪'}
    else{
        sl.classList.add('open');
        var t=L[lang];this.textContent=t?t.sl_close:'cerrar';
        if(sl.querySelector('li')) return;
        var list=document.getElementById('slList');
        S.forEach(function(s,i){
            var li=document.createElement('li');
            li.innerHTML=s;
            list.appendChild(li);
        });
    }
});

/* ===== SCROLL REVEAL ===== */
var observer;
function observeReveals(){
    if(observer) observer.disconnect();
    observer=new IntersectionObserver(function(entries){
        entries.forEach(function(e){if(e.isIntersecting) e.target.classList.add('visible')});
    },{threshold:0.08,rootMargin:'0px 0px -30px 0px'});
    document.querySelectorAll('.reveal').forEach(function(el){observer.observe(el)});
}

/* ===== PARTICLES ===== */
(function(){
    var c=document.getElementById('particles'),ctx=c.getContext('2d'),ps=[],N=22;
    function resize(){c.width=window.innerWidth;c.height=document.documentElement.scrollHeight}
    resize();window.addEventListener('resize',resize);
    var rt;window.addEventListener('scroll',function(){clearTimeout(rt);rt=setTimeout(resize,200)});
    for(var i=0;i<N;i++) ps.push({x:Math.random()*c.width,y:Math.random()*c.height,s:Math.random()*1.6+.4,sy:-(Math.random()*.2+.06),sx:(Math.random()-.5)*.12,o:Math.random()*.18+.05,os:(Math.random()-.5)*.002,h:Math.random()>.5?'196,139,159':'201,169,110'});
    var mq=window.matchMedia('(prefers-reduced-motion: reduce)');
    function anim(){
        ctx.clearRect(0,0,c.width,c.height);
        for(var i=0;i<ps.length;i++){
            var p=ps[i];ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,6.28);
            ctx.fillStyle='rgba('+p.h+','+p.o+')';ctx.fill();
            if(p.s>1){ctx.beginPath();ctx.arc(p.x,p.y,p.s*3,0,6.28);ctx.fillStyle='rgba('+p.h+','+(p.o*.12)+')';ctx.fill()}
            p.y+=p.sy;p.x+=p.sx;p.o+=p.os;
            if(p.o<=.02||p.o>=.22)p.os*=-1;
            if(p.y<-20){p.y=c.height+20;p.x=Math.random()*c.width}
            if(p.x<-20)p.x=c.width+20;if(p.x>c.width+20)p.x=-20;
        }
        requestAnimationFrame(anim);
    }
    if(!mq.matches) anim();
    mq.addEventListener('change',function(){if(mq.matches){ctx.clearRect(0,0,c.width,c.height)}else{anim()}});
})();

/* ===== TAB TITLE ===== */
var titleHidden=['te extraño...','vuelve...','te pienso...','💗'];
var titleIdx=0;
var titleInterval;
var originalTitle='Para ti';
document.addEventListener('visibilitychange',function(){
    if(document.hidden){
        titleIdx=0;
        document.title=titleHidden[0];
        titleInterval=setInterval(function(){titleIdx=(titleIdx+1)%titleHidden.length;document.title=titleHidden[titleIdx]},2500);
    }else{
        clearInterval(titleInterval);
        document.title=originalTitle;
    }
});

/* ===== INIT ===== */
render();
